<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تست AhmSpace</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background: #0f172a; color: white; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 15px; margin-bottom: 15px; border-right: 5px solid #10b981; }
        h2 { color: #10b981; }
        .result { font-weight: bold; color: #34d399; }
    </style>
</head>
<body>
    <h1>🌌 تست کتابخانه AhmSpace</h1>

    <div class="card">
        <h2>🛰️ زاویه دیش برای ماهواره (از کرمان)</h2>
        <p>Azimuth: <span class="result" id="resAzimuth"></span> درجه</p>
        <p>Elevation: <span class="result" id="resElevation"></span> درجه</p>
    </div>

    <div class="card">
        <h2>⚫ شعاع سیاهچاله (جرم خورشید)</h2>
        <p>شعاع: <span class="result" id="resBlackHole"></span> کیلومتر</p>
    </div>

    <div class="card">
        <h2>⏱️ اتساع زمان (با سرعت ۹۰٪ نور)</h2>
        <p>هر ۱ ساعت برای تو = <span class="result" id="resTime"></span> ساعت روی زمین</p>
    </div>

    <script src="ahm-space.js"></script>
    <script>
        // تست محاسبه دیش (کرمان: 30.28, 57.08 - ماهواره: 0, 0)
        const dish = AhmSpace.calculateDishAngle(30.28, 57.08, 0, 0);
        document.getElementById('resAzimuth').innerText = dish.azimuth.toFixed(2);
        document.getElementById('resElevation').innerText = dish.elevation.toFixed(2);

        // تست شعاع سیاهچاله (جرم خورشید)
        const bhRadius = AhmSpace.schwarzschildRadius(AhmSpace.CONSTANTS.SUN_MASS) / 1000;
        document.getElementById('resBlackHole').innerText = AhmSpace.formatNumber(bhRadius);

        // تست اتساع زمان
        const dilation = AhmSpace.timeDilation(0.9 * AhmSpace.CONSTANTS.C);
        document.getElementById('resTime').innerText = dilation.toFixed(2);
    </script>
</body>
</html>
